# Minimal Supabase CLI config for local development (`supabase start`).
project_id = "chairside"

[api]
port = 54321
schemas = ["public", "storage"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

# Local magic-link emails land in the Inbucket/Mailpit inbox at http://localhost:54324
[inbucket]
port = 54324

[storage]
file_size_limit = "25MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

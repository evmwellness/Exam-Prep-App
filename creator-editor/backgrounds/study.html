<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
  .room{position:absolute;inset:0;
    background:
      radial-gradient(900px 1100px at 15% 30%, rgba(255,214,160,.55), transparent 70%),
      radial-gradient(800px 900px at 95% 20%, rgba(220,232,240,.45), transparent 70%),
      linear-gradient(180deg,#e9e1d4 0%,#e4dacb 55%,#d8ccb9 100%);}
  /* window light streaks on wall */
  .light{position:absolute;right:-120px;top:120px;width:520px;height:1100px;
    background:repeating-linear-gradient(100deg, rgba(255,250,238,.35) 0 70px, transparent 70px 120px);
    filter:blur(18px);transform:skewY(-8deg)}
  .shelf{position:absolute;height:22px;background:linear-gradient(#b48a5e,#8f6a44);
    box-shadow:0 18px 30px rgba(60,40,20,.25);border-radius:3px}
  .book{position:absolute;bottom:22px;border-radius:2px 2px 0 0;box-shadow:inset -6px 0 0 rgba(0,0,0,.08)}
  .frame{position:absolute;background:#f6f1e8;border:14px solid #c9a87f;box-shadow:0 20px 40px rgba(60,40,20,.2)}
  .frame i{position:absolute;inset:40px;border-radius:50%;
    background:radial-gradient(circle at 40% 40%,#d9b48c,#b7835a 60%,transparent 61%)}
  .lamp{position:absolute;left:40px;top:700px;width:260px;height:150px;border-radius:130px 130px 10px 10px;
    background:linear-gradient(#efe3cf,#d7c3a3);box-shadow:0 60px 160px 80px rgba(255,205,140,.55)}
  .plant{position:absolute;border-radius:50% 50% 50% 0;background:#7f9473}
</style></head><body>
<div class="room"></div>
<div class="light"></div>
<div class="lamp"></div>

<div class="frame" style="left:620px;top:380px;width:300px;height:380px"><i></i></div>

<!-- upper shelf -->
<div class="shelf" style="left:60px;top:1150px;width:560px"></div>
<div class="book" style="left:110px;top:900px;width:46px;height:250px;background:#9aa98f"></div>
<div class="book" style="left:160px;top:930px;width:38px;height:220px;background:#d8c7a8"></div>
<div class="book" style="left:202px;top:910px;width:52px;height:240px;background:#c08a68"></div>
<div class="book" style="left:258px;top:950px;width:34px;height:200px;background:#efe6d6"></div>
<div class="book" style="left:300px;top:1100px;width:200px;height:50px;background:#a7b4a0;border-radius:3px"></div>
<div class="plant" style="left:470px;top:960px;width:90px;height:140px;transform:rotate(-20deg)"></div>
<div class="plant" style="left:510px;top:980px;width:80px;height:120px;transform:rotate(25deg);background:#6d8463"></div>

<!-- right shelf -->
<div class="shelf" style="left:640px;top:1000px;width:420px"></div>
<div class="book" style="left:700px;top:790px;width:40px;height:210px;background:#e2d3b8"></div>
<div class="book" style="left:744px;top:770px;width:48px;height:230px;background:#8e9e85"></div>
<div class="book" style="left:796px;top:810px;width:36px;height:190px;background:#cfa384"></div>
<div style="position:absolute;left:880px;top:900px;width:110px;height:100px;border-radius:12px 12px 30px 30px;background:#efe8dc"></div>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFC530">
<title>Seven Minute Sunrise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --sun:#FFC530; --tang:#FF7A3D; --berry:#FF4F93; --grape:#7A5CFF; --mint:#1FCB94; --sky:#29B6F6;
  --ink:#2A2150; --bg:#EAF5FF; --surface:#FFFFFF; --surface2:#F4F0FF; --text:#2A2150; --muted:#5E5790; --line:#D9D2F5;
  --shadow:0 3px 0 rgba(42,33,80,.12);
  --display:"Fredoka","Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16123A; --surface:#231D55; --surface2:#2C2566; --text:#F6F3FF; --muted:#BDB5EE; --line:#3F3685;
    --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16123A; --surface:#231D55; --surface2:#2C2566; --text:#F6F3FF; --muted:#BDB5EE; --line:#3F3685;
  --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:12px 48px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.45rem;letter-spacing:.2px}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.kids{display:flex;gap:6px;flex-wrap:wrap}
.kidchip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:.85rem}
.kidchip .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:1rem;background:var(--kc)}
.kidchip b{font-variant-numeric:tabular-nums}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:5px;margin-block:4px 16px}
.tabs button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:13px;font-family:var(--display);font-weight:600;font-size:1rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--grape);color:#fff;box-shadow:var(--shadow)}

/* hero */
.hero{border-radius:26px;padding:20px;color:var(--ink);background:var(--tc,var(--sun));position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.28)}
.hero .eyebrow{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;position:relative;z-index:1}
.hero h2{font-size:clamp(1.6rem,5.5vw,2.3rem);margin-block:4px 10px;position:relative;z-index:1;padding-right:64px}
.hero .eyebrow{padding-right:64px}
.hero .themeEmoji{position:absolute;right:18px;top:14px;font-size:3.2rem;z-index:1}
.pills{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.75);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.88rem}
.hero p{position:relative;z-index:1;margin:10px 0 0;font-weight:700;max-width:52ch}
.startBtn{position:relative;z-index:1;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:20px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:700;font-size:1.35rem;padding:16px;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .1s}
.startBtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.viewing{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-weight:800;color:var(--muted);flex-wrap:wrap}
.linkBtn{border:0;background:none;color:var(--grape);font-weight:800;text-decoration:underline;padding:4px}
:root[data-theme="dark"] .linkBtn{color:#B7A6FF}

/* step cards */
.sectionHead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-block:22px 10px}
.sectionHead h3{font-size:1.25rem}
.sectionHead span{color:var(--muted);font-weight:700;font-size:.9rem}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.step{display:grid;grid-template-columns:78px 1fr;background:var(--surface);border:2px solid var(--line);border-radius:22px;overflow:hidden}
.step .side{background:var(--sc);color:var(--sf,var(--ink));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:12px 4px}
.step .side .num{font-family:var(--display);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.step .side .em{font-size:2rem;line-height:1}
.step .side .dur{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.7);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:.85rem}
.step .body{padding:12px 14px 14px;min-width:0}
.step .kind{font-weight:800;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.step h4{font-family:var(--display);font-size:1.2rem;margin:2px 0 6px;font-weight:700}
.step ol{margin:0 0 8px;padding-left:20px}
.step ol li{margin-bottom:2px}
.tag{display:inline-block;font-size:.75rem;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--surface2);color:var(--text);margin-left:6px;vertical-align:middle}
.ages{display:grid;gap:6px;margin-top:6px}
.age{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:.9rem;background:var(--surface2);border-radius:12px;padding:6px 10px}
.age .who{font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:5px}
.age .dot{width:10px;height:10px;border-radius:50%;background:var(--kc);display:inline-block}

.doneRow{display:flex;flex-wrap:wrap;gap:8px}
.starBtn{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;font-weight:800}
.starBtn .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--kc);font-size:1.1rem}
.starBtn[aria-pressed="true"]{border-color:var(--kc);background:color-mix(in srgb,var(--kc) 22%,var(--surface))}
.starBtn .s{font-size:1.1rem;filter:grayscale(1);opacity:.4}
.starBtn[aria-pressed="true"] .s{filter:none;opacity:1}

.note{background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:14px 16px;margin-top:16px}
.note h3{font-size:1.05rem;margin-bottom:4px}
.note p{margin:0}

/* calendar */
.calHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calHead h2{font-size:1.5rem}
.navBtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.2rem;font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-weight:800;font-size:.75rem;color:var(--muted);text-transform:uppercase;padding-bottom:2px}
.cell{aspect-ratio:1/1.12;max-width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0}
.cell .dn{font-family:var(--display);font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums;align-self:flex-start;line-height:1}
.cell .mi{font-size:1.05rem;line-height:1}
.cell .dots{display:flex;gap:2px;min-height:8px}
.cell .dots i{width:7px;height:7px;border-radius:50%;background:var(--kc)}
.cell.today{background:var(--sun);color:var(--ink);border-color:var(--tang)}
.cell.sel{outline:3px solid var(--grape);outline-offset:1px}
.cell.blank{visibility:hidden}
.weekList{margin-top:16px;display:grid;gap:8px}
.weekItem{display:flex;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-weight:700}
.weekItem .e{font-size:1.5rem}
.weekItem small{display:block;color:var(--muted);font-weight:700}

/* grown-ups */
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.card h3{font-size:1.2rem;margin-bottom:8px}
.card p{margin:0 0 8px;max-width:65ch}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-weight:800;font-size:.9rem}
.field input,.field select{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--text);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:10px 16px;font-family:var(--display);font-weight:600;font-size:1rem;background:var(--grape);color:#fff;box-shadow:var(--shadow)}
.btn.alt{background:var(--surface2);color:var(--text);border:2px solid var(--line);box-shadow:none}
details.tip{border-top:2px solid var(--line);padding-block:8px}
details.tip summary{font-weight:800;cursor:pointer}
details.tip p{margin:6px 0 0}
.tipNow{background:var(--surface2);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.tipNow b{font-family:var(--display);font-size:1.05rem}
.muted{color:var(--muted)}

/* player */
.player{position:fixed;inset:0;z-index:50;background:var(--pc);color:var(--pf);display:flex;flex-direction:column;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .5s}
.pInner{max-width:640px;width:100%;margin:0 auto;padding-inline:16px;padding-block:10px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.pTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pTop button{border:0;background:rgba(255,255,255,.8);color:var(--ink);border-radius:14px;height:44px;min-width:44px;padding:0 12px;font-weight:800}
.pTotal{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.8);color:var(--ink);border-radius:14px;padding:8px 14px}
.segBar{display:grid;grid-template-columns:60fr 120fr 150fr 90fr;gap:4px}
.segBar div{height:10px;border-radius:99px;background:rgba(255,255,255,.45);overflow:hidden}
.segBar div i{display:block;height:100%;background:var(--ink);width:0}
.ringWrap{position:relative;width:min(62vw,250px);aspect-ratio:1;max-width:100%;margin:4px auto 0}
.ringWrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringWrap .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ringWrap .bigEm{font-size:3.4rem;line-height:1}
.ringWrap .segTime{font-family:var(--display);font-weight:700;font-size:2.4rem;font-variant-numeric:tabular-nums;line-height:1}
.ringWrap .bubble{position:absolute;inset:14%;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(.7);transition:transform 4s ease-in-out}
.ringWrap .bubble.in{transform:scale(1)}
.breathWord{text-align:center;font-family:var(--display);font-weight:700;font-size:1.2rem;min-height:1.6em}
.pTitle{text-align:center}
.pTitle .k{font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:.8rem}
.pTitle h2{font-size:clamp(1.6rem,6vw,2.2rem)}
.pCard{background:rgba(255,255,255,.88);color:var(--ink);border-radius:20px;padding:14px 16px}
.pCard ol{margin:0;padding-left:22px;font-weight:700;font-size:1.05rem}
.pCard ol li{margin-bottom:4px}
.pCard .ages .age{background:rgba(42,33,80,.07);color:var(--ink)}
.pCtrls{display:flex;gap:12px;justify-content:center;margin-top:auto;padding-top:6px}
.pCtrls button{border:0;border-radius:20px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:700;font-size:1.15rem;padding:14px 22px;min-width:120px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.pCtrls button.ghost{background:rgba(255,255,255,.85);color:var(--ink)}
.finish{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:20px}
.finish .trophy{font-size:5rem;line-height:1}
.finish h2{font-size:2.2rem}
.finish p{margin:0;font-weight:700;max-width:40ch}
.finish .doneRow{justify-content:center}
.finish .starBtn{background:rgba(255,255,255,.9);color:var(--ink)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

@media (max-width:460px){
  .step{grid-template-columns:62px 1fr}
  .step .side .em{font-size:1.6rem}
  .cell{border-radius:10px;padding:3px}
  .cell .mi{font-size:.9rem}
  .grid{gap:3px}
  .kidchip span.nm{display:none}
  .age{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion: reduce){
  .ringWrap .bubble{transition:none}
  .startBtn,.player{transition:none}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="22" cy="26" r="11" fill="#FFC530"/>
        <g stroke="#FF7A3D" stroke-width="3.5" stroke-linecap="round">
          <line x1="22" y1="4" x2="22" y2="9"/><line x1="6" y1="12" x2="9.5" y2="15.5"/><line x1="38" y1="12" x2="34.5" y2="15.5"/>
          <line x1="1" y1="27" x2="6" y2="27"/><line x1="38" y1="27" x2="43" y2="27"/>
        </g>
        <rect x="0" y="34" width="44" height="10" fill="#1FCB94" rx="3"/>
        <text x="22" y="31" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="12" fill="#2A2150">7</text>
      </svg>
      <div><h1>Seven Minute Sunrise</h1><small>Morning brain warm-ups</small></div>
    </div>
    <div class="kids" id="kidsBar"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-today" aria-selected="true" data-v="today">☀️ Today</button>
    <button role="tab" id="tab-cal" aria-selected="false" data-v="cal">📅 Calendar</button>
    <button role="tab" id="tab-grown" aria-selected="false" data-v="grown">🧑 Grown-ups</button>
  </nav>

  <main id="view"></main>
</div>

<div class="player" id="player" hidden></div>
<canvas id="confetti" hidden></canvas>

<script>
/* ---------- Activity library ---------- */
function A(e,n,say,steps,a3,a5,a7,cues,m){return {e,n,say,steps,a3,a5,a7,cues:cues||[],m:m||"any"};}

const BREATHE=[
A("🎈","Balloon Belly","Put your hands on your tummy. Breathe in through your nose and blow your belly up like a giant balloon. Now let the air out slowly. Psssssss!",["Hands on your tummy","Breathe in through your nose, tummy puffs out","Breathe out through your mouth, tummy goes flat","Do it 6 slow times"],"Put their hands on your tummy first, then on their own. Puff up together.","Count 3 in and 3 out.","Count 4 in, hold for 2, then 6 out.",["Bigger balloon... and psssss.","Slow and gentle. Your balloon is the best one yet!","One more giant balloon!"]),
A("🌸","Flower and Candle","Hold up a pretend flower in one hand and a pretend candle in the other. Smell the flower, mmmm. Now blow out the candle, whoooo.",["Hold a pretend flower and a pretend candle","Sniff the flower slowly through your nose","Blow the candle out slowly through your mouth","Swap hands halfway"],"Use a real flower or a toy if you have one. Big sniff, big blow.","Blow so gently the candle only flickers.","Blow out 5 birthday candles one at a time in one long breath.",["Smell the flower... blow the candle.","Swap hands! Flower in the other hand now.","So calm. Last flower!"]),
A("🐰","Bunny Breaths","Let's be bunnies! Three quick sniffs through your nose, sniff sniff sniff, then one long breath out. Wiggle your bunny nose!",["Sit like a bunny with paws up","Three quick sniffs in through your nose","One long, slow breath out","Repeat 6 times"],"Two sniffs is fine. Wiggle noses together first.","Three sniffs, then breathe out for 4.","Three sniffs, then out for 6, making no sound at all.",["Sniff, sniff, sniff... and out.","Wiggly bunny noses!","Last bunny breath. Lovely!"]),
A("🐍","Snake Hiss","Sit up tall. Breathe in through your nose, then let it out as a long, slow snake hiss. Sssssssss. How long can your snake be?",["Sit up tall like a snake ready to slither","Breathe in through your nose","Hiss out slowly: ssssss","Try to make each hiss longer"],"Make the hiss together and see whose snake is sillier.","Count how long your hiss lasts.","Beat your own record each time, nice and quiet.",["Long, long snake. Sssss.","Can your snake be even longer?","Last big hiss!"]),
A("☕","Hot Chocolate","Hold a pretend mug of hot chocolate with both hands. Smell it, mmm, chocolatey! Now blow on it gently to cool it down.",["Hold a pretend mug with two hands","Smell the hot chocolate slowly","Blow gently to cool it down","Don't spill! Slow and steady"],"Hold a real cup together. Take it slow.","Pretend to add marshmallows between breaths.","Blow so softly the pretend steam just wiggles.",["Smell... and cool it down.","Add a marshmallow! Now another breath.","Yum. Last sip breath."]),
A("⭐","Star Breathing","Hold up one hand like a star. With your other finger, trace the star. Breathe in going up, breathe out going down.",["Spread one hand like a star","Trace up a finger: breathe in","Trace down: breathe out","Go around the whole star twice"],"Trace their fingers for them, slowly.","Trace the whole star once, then swap hands.","Close your eyes and trace without looking.",["Up... and down.","Swap hands! Trace the other star.","Nearly finished. Nice and slow."]),
A("🌈","Rainbow Arms","Stand tall. Sweep your arms up high in a big rainbow as you breathe in. Float them down as you breathe out.",["Stand tall with arms by your sides","Sweep arms up in a rainbow, breathe in","Float arms down, breathe out","Make each rainbow slower"],"Hold hands and make the rainbow together.","Name a rainbow colour on each breath.","Say all seven rainbow colours in order, one per breath.",["Up goes the rainbow... and down.","Red, orange, yellow...","Green, blue, purple. Beautiful!"]),
A("🐝","Bumblebee Hum","Breathe in through your nose. Now close your lips and hum like a buzzy bumblebee. Mmmmmmm. Feel the tickle!",["Sit comfortably","Breathe in through your nose","Close your lips and hum out: mmmm","Put a hand on your chest and feel the buzz"],"Hum a tune together. Touch cheeks to feel the buzz.","Hum as long as you can.","Cover your ears gently and hum. It sounds like a bee inside your head!",["Buzz, buzz, hummm.","Feel the buzzy tickle?","Last big hum!"]),
A("🐉","Friendly Dragon","You are a friendly dragon. Take a big breath in, then breathe out warm dragon fire. Haaaaa! Not too scary. A kind dragon!",["Take a big dragon breath in","Breathe out with a big haaaa","Stretch your arms like wings","Be a kind, calm dragon"],"Make gentle dragon faces at each other.","Breathe fire slowly so it lasts ages.","Every breath, make the fire quieter until it is a whisper.",["Haaaa... kind dragon fire.","Flap your wings once. Now breathe.","Quietest dragon breath ever!"]),
A("🟦","Square Breathing","Draw a square in the air with your finger. Breathe in along the top, hold down the side, breathe out along the bottom, and hold up the other side.",["Draw a square in the air","Top side: breathe in for 4","Right side: hold for 4","Bottom: breathe out for 4. Left side: hold for 4"],"Just draw the square and breathe in and out. No holding needed.","Count to 3 on each side.","Count to 4 and draw the square as slowly as a snail.",["In, 2, 3, 4. Hold, 2, 3, 4.","Out, 2, 3, 4. Hold, 2, 3, 4.","Last square. You're a square breathing expert!"]),
A("🧸","Teddy Ride","Lie on your back and put a teddy on your tummy. Breathe in and lift teddy up. Breathe out and bring teddy down. Give teddy a gentle ride!",["Lie on your back","Put a soft toy on your tummy","Breathe in: teddy goes up","Breathe out: teddy goes down"],"Lie next to them with your own teddy and copy.","Make teddy rise slowly so he doesn't fall.","Close your eyes and count 10 teddy rides.",["Up goes teddy... and down.","Is your teddy asleep yet?","Last ride for teddy."]),
A("🪶","Feather Float","Hold out your hand with a pretend feather on it. Blow very gently to keep it floating in the air. Too hard and it flies away!",["Hold out a flat hand","Imagine a feather on it","Blow slowly and gently","Keep the feather floating"],"Use a real tissue scrap and blow it along the floor.","Blow so gently it just wobbles.","Blow the feather in a slow circle around the room with your breath.",["Gentle, gentle blow.","Keep it floating...","Catch your feather. Well done!"]),
A("🌊","Ocean Waves","Breathe in and your wave rolls up. Breathe out and the wave crashes on the sand. Shhhhhh.",["Sit or lie down","Breathe in: the wave rolls in","Breathe out: shhhh, the wave goes out","Move your arms like waves"],"Make shhh sounds together, rocking side to side.","Make big waves then tiny waves.","Make the waves slower and slower until the sea is calm.",["Wave in... and shhhhh.","Tiny, calm waves now.","The ocean is still. Beautiful."]),

const TIPS=[
["Eye level, one instruction","Get down to their eye level, say their name, wait for eye contact, then give one short instruction. Instructions shouted from another room are the easiest to tune out."],
["Ask them to say it back","After an instruction, ask: What did I just ask you to do? Saying it back makes children process it, and you know it has landed."],
["Use When... then...","Try: When your shoes are on, then we can go to the park. It is calmer than a threat and makes the order clear."],
["Name the feeling first","Before fixing anything, name what they feel: You're really cross that you lost. Children calm faster when they feel understood. It does not mean giving in."],
["Consequences: short and calm","State the consequence once before the activity. If it happens, follow through calmly with few words and no lecture. Talk it over later when everyone is calm."],
["Model losing out loud","When you lose a game, narrate it: Oh, I lost. That's disappointing. Good game! Children learn to lose from watching grown-ups do it."],
["Praise the effort","Say what they did: You kept trying even when it was hard. Specific effort praise helps children cope with setbacks better than you're so clever."],
["Warn before transitions","Give a 2 minute warning before stopping an activity, and use a visual timer. Sudden stops are a common meltdown trigger."],
["Why they hold it together at school","Many children use a lot of self-control at school and let it go at home, where they feel safest. It is common, and it shows they trust you. After-school snacks and downtime help."],
["Connect before you correct","Even 5 to 10 minutes of one-on-one play a day, where the child leads, makes them more likely to cooperate at other times."],
["Fewer words","Keep instructions under about 10 words. Long explanations during a tense moment get lost. Save the explanation for later."],
["Repair after a meltdown","When everyone is calm, talk about what happened, what they felt, and what to try next time. Ending with a hug shows the relationship is safe."],
["Make a calm corner","Set up a cosy spot with a cushion, a soft toy and a picture of these breathing exercises. Practise going there when calm, so it's familiar when upset."],
["Check the basics","Hungry, tired or overstimulated children melt down more easily. Check sleep, snacks and screen time before assuming defiance."],
["Offer two choices","Do you want to brush teeth before or after pyjamas? Choices give children some control and reduce power struggles."],
["Don't argue about blame","If they blame you, reflect it without debating: You wish the rule was different. The rule is still the rule. Then stop talking."],
["Rehearse the game rules","Before a game, ask: What do we do if we lose? Let them say the plan out loud, like: say good game and take a breath."],
["Catch them listening","When they listen the first time, notice it straight away: You came as soon as I called. Thank you! What gets noticed gets repeated."],
["Get attention playfully","Try whispering, a silly voice, or a secret signal like a double clap. Children often tune in faster to something unexpected."],
["Breathe out loud yourself","When you feel frustrated, say: I'm feeling cross, so I'm going to take three breaths. It teaches them the skill in real life."],
["Same order every morning","A predictable routine lowers stress. Use this 7 minute routine at the same point every day, like after breakfast or before shoes."],
["Share leader turns fairly","With siblings, keep a visible roster of who leads the game each day. It reduces fairness arguments before they begin."],
["Screen-free start","Try keeping screens off until after the morning routine. The 7 minutes goes better before a screen, and transitions away from screens are hard."],
["Sleep matters","Children aged 3 to 5 generally need 10 to 13 hours of sleep including naps. Children 6 to 12 need 9 to 12 hours. Tired brains find self-control harder."],
["Say what to do, not what to stop","Swap stop yelling for use your quiet voice. Children follow a clear action more easily than a no."],
["When to get support","If meltdowns are very frequent, intense, or getting worse, or you're worried, it is worth talking to your GP or child health nurse. Asking for help is a strength."]
];

/* ---------- Plan generation ---------- */
const gcd=(a,b)=>b?gcd(b,a%b):a;
function rot(arr,i,salt){const L=arr.length;const s=[7,5,11,13,3,1].find(x=>gcd(x,L)===1);return arr[(i*s+salt)%L];}
function doy(dt){return Math.round((Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())-Date.UTC(dt.getFullYear(),0,1))/864e5);}
function keyOf(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function planFor(dt){
  const y=dt.getFullYear(),d=doy(dt),mode=WEEK_MODE[dt.getDay()];
  let n=0;for(let i=0;i<d;i++){if(WEEK_MODE[new Date(y,0,1+i).getDay()]===mode)n++;}
  const games=GAMES.filter(g=>g.m===mode);
  const moves=MOVES.filter(m=>m.m===(mode==="partner"?"partner":"solo"));
  const week=Math.floor(d/7);
  const acts={breathe:rot(BREATHE,d,y%5),move:rot(moves,n,mode==="family"?4:0),game:rot(games,n,y%3),calm:rot(CALM,d,3+y%4)};
  return {date:dt,d,mode,week,theme:THEMES[Math.min(week,THEMES.length-1)],tip:TIPS[week%TIPS.length],
    segs:ORDER.map(k=>({k,dur:SEG[k].dur,a:acts[k]}))};
}

}
function toggleStar(dt,i,force){
  const k=keyOf(dt);const v=done[k]||[false,false,false];v[i]=force===undefined?!v[i]:force;done[k]=v;store.set("sms.done",done);renderKidsBar();
}

function renderToday(){
  const p=planFor(selDate),isToday=sameDay(selDate,new Date()),m=MODES[p.mode];
  const tc=THEME_COLORS[p.week%THEME_COLORS.length];
  $("#view").innerHTML=`
    ${isToday?"":`<div class="viewing"><span>Viewing ${niceDate(selDate)}</span><button class="linkBtn" id="backToday">Back to today</button></div>`}
    <section class="hero" style="--tc:${tc}">
      <div class="themeEmoji" aria-hidden="true">${p.theme[1]}</div>
      <div class="eyebrow">Day ${p.d+1} of the year · Week ${p.week+1}: ${esc(p.theme[0])}</div>
      <h2>${niceDate(selDate)}</h2>
      <div class="pills"><span class="pill">${m.icon} ${m.label}</span><span class="pill">⏱ 7 minutes</span><span class="pill">🧒 Ages 3, 5 and 7</span></div>
      <p>${m.hint}</p>
      <button class="startBtn" id="startBtn">▶ Start 7 minutes</button>
    </section>
    <div class="sectionHead"><h3>Today's four steps</h3><span>1 + 2 + 2½ + 1½ = 7 min</span></div>
    <ol class="steps">
      ${p.segs.map((s,i)=>{const S=SEG[s.k];return `<li class="step" style="--sc:${S.color};--sf:${S.fg}">
        <div class="side"><span class="num">Step ${i+1}</span><span class="em">${s.a.e}</span><span class="dur">${fmt(s.dur)}</span></div>
        <div class="body"><div class="kind">${S.label}</div><h4>${esc(s.a.n)}${modeTag(s.a,p.mode)}</h4>
          <ol>${s.a.steps.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>
          <div class="ages">${agesHTML(s.a)}</div></div></li>`}).join("")}
    </ol>
    <div class="sectionHead"><h3>Who did it ${isToday?"today":"this day"}?</h3><span>Tap to give a star</span></div>
    ${doneButtons(selDate)}
    <div class="note"><h3>💡 Grown-up tip of the week: ${esc(p.tip[0])}</h3><p>${esc(p.tip[1])}</p></div>`;
  $("#startBtn").onclick=()=>startSession(p);
  const bt=$("#backToday");if(bt)bt.onclick=()=>{selDate=new Date();renderToday();};
  document.querySelectorAll("#view [data-star]").forEach(b=>b.onclick=()=>{toggleStar(selDate,+b.dataset.star);b.setAttribute("aria-pressed",String(!!done[keyOf(selDate)][+b.dataset.star]));});
}

function renderCal(){
  const y=calMonth.getFullYear(),mo=calMonth.getMonth(),first=new Date(y,mo,1).getDay(),days=new Date(y,mo+1,0).getDate(),today=new Date();
  let cells="";for(let i=0;i<first;i++)cells+=`<div class="cell blank" aria-hidden="true"></div>`;
  for(let d=1;d<=days;d++){const dt=new Date(y,mo,d),mode=WEEK_MODE[dt.getDay()],v=done[keyOf(dt)]||[];const p=planFor(dt);
    cells+=`<button class="cell${sameDay(dt,today)?" today":""}${sameDay(dt,selDate)?" sel":""}" data-day="${d}" aria-label="${niceDate(dt)}: ${esc(p.segs[2].a.n)}, ${MODES[mode].label}">
      <span class="dn">${d}</span><span class="mi">${MODES[mode].icon}</span><span class="dots">${v.map((x,i)=>x?`<i style="--kc:${KID_COLORS[i]}"></i>`:"").join("")}</span></button>`;}
  const weeks=[];for(let d=1;d<=days;d++){const p=planFor(new Date(y,mo,d));if(!weeks.find(w=>w[0]===p.theme[0]))weeks.push(p.theme);}
  $("#view").innerHTML=`
    <div class="calHead"><button class="navBtn" id="prevM" aria-label="Previous month">‹</button><h2>${MON[mo]} ${y}</h2><button class="navBtn" id="nextM" aria-label="Next month">›</button></div>
    <div class="legend"><span>🧍 Do it alone</span><span>🤝 With a partner</span><span>🏠 Whole family</span><span>● Stars earned</span></div>
    <div class="grid">${["S","M","T","W","T","F","S"].map(x=>`<div class="dow">${x}</div>`).join("")}${cells}</div>
    <div class="sectionHead"><h3>Themes this month</h3><span>Tap a day to see its plan</span></div>
    <div class="weekList">${weeks.map(t=>`<div class="weekItem"><span class="e">${t[1]}</span><div>${esc(t[0])}<small>Weekly adventure theme</small></div></div>`).join("")}</div>`;
  $("#prevM").onclick=()=>{calMonth=new Date(y,mo-1,1);renderCal();};
  $("#nextM").onclick=()=>{calMonth=new Date(y,mo+1,1);renderCal();};
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{selDate=new Date(y,mo,+b.dataset.day);setView("today");});
}

function renderGrown(){
  const p=planFor(new Date());
  $("#view").innerHTML=`
    <div class="card"><h3>Your children</h3><p class="muted">Names and emoji show on the star chart and the age tips.</p>
      ${kids.map((k,i)=>`<div class="row" style="margin-bottom:8px"><div class="field" style="flex:0 0 72px;margin:0"><label for="ke${i}">Emoji</label><input id="ke${i}" value="${esc(k.emoji)}" maxlength="4"></div><div class="field" style="flex:1;min-width:140px;margin:0"><label for="kn${i}">Name (age ${k.age})</label><input id="kn${i}" value="${esc(k.name)}" maxlength="20"></div></div>`).join("")}
      <button class="btn" id="saveKids">Save names</button> <span id="savedMsg" class="muted" role="status"></span></div>
    <div class="card"><h3>Narrator voice</h3>
      <div class="field"><label for="voiceSel">Voice</label><select id="voiceSel"></select></div>
      <div class="field"><label for="rateSel">Speed</label><select id="rateSel">${[[0.8,"Slow"],[0.95,"Normal"],[1.1,"Quick"]].map(([v,l])=>`<option value="${v}"${+prefs.rate===v?" selected":""}>${l}</option>`).join("")}</select></div>
      <div class="row"><button class="btn" id="testVoice">🔊 Test voice</button><label class="row" style="gap:6px;font-weight:800"><input type="checkbox" id="muteChk"${prefs.muted?" checked":""}> Mute narrator</label></div>
      <p class="muted" style="margin-top:8px">The voice comes from your phone or computer. Turn the ringer or silent switch off if you can't hear it.</p></div>
    <div class="card"><h3>How the 7 minutes works</h3>
      <p>Every day has the same four steps, so children know what's coming: <b>Breathe</b> (1 min), <b>Move</b> (2 min), <b>Brain game</b> (2½ min) and <b>Calm and ready</b> (1½ min).</p>
      <p>The moves cross the middle of the body (right hand to left knee), which uses both sides of the body together. The games practise listening, waiting, remembering instructions and losing kindly. These are the skills behind following instructions and handling not winning. The breathing and calm steps practise settling down while everyone is already calm, so it's easier to use when they're upset.</p>
      <p class="muted">Keep it light and playful. Short daily practice matters more than doing it perfectly. It's a helpful routine, not a treatment, and it won't replace connection, sleep and consistent boundaries.</p></div>
    <div class="card"><h3>Grown-up tips</h3>
      <div class="tipNow"><b>This week: ${esc(p.tip[0])}</b><p style="margin:4px 0 0">${esc(p.tip[1])}</p></div>
      ${TIPS.map(t=>`<details class="tip"><summary>${esc(t[0])}</summary><p>${esc(t[1])}</p></details>`).join("")}</div>
    <div class="card"><h3>Weekly rhythm</h3><p>Mon and Wed: 🧍 do it alone · Tue, Thu and Sat: 🤝 with a partner · Fri and Sun: 🏠 whole family.</p>
      <p class="muted">${BREATHE.length} breathing exercises, ${MOVES.length} moves, ${GAMES.length} brain games and ${CALM.length} calm-downs combine into a different plan for every day of the year, with 53 weekly themes.</p></div>`;
  $("#saveKids").onclick=()=>{kids=kids.map((k,i)=>({...k,name:$("#kn"+i).value.trim()||k.name,emoji:$("#ke"+i).value.trim()||k.emoji}));store.set("sms.kids",kids);renderKidsBar();$("#savedMsg").textContent="Saved!";};
  fillVoices();
  $("#voiceSel").onchange=e=>{prefs.voice=e.target.value;store.set("sms.prefs",prefs);};
  $("#rateSel").onchange=e=>{prefs.rate=+e.target.value;store.set("sms.prefs",prefs);};
  $("#muteChk").onchange=e=>{prefs.muted=e.target.checked;store.set("sms.prefs",prefs);};
  $("#testVoice").onclick=()=>{const m=prefs.muted;prefs.muted=false;say("Good morning, superstars! Are your brains ready to wake up? Let's go!",true);prefs.muted=m;};
}

function setView(v){
  view=v;document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.v===v)));
  if(v==="today")renderToday();else if(v==="cal"){calMonth=new Date(selDate.getFullYear(),selDate.getMonth(),1);renderCal();}else renderGrown();
  window.scrollTo(0,0);
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setView(b.dataset.v));

/* ---------- Voice ---------- */
const synth=window.speechSynthesis;
function voices(){try{return synth?synth.getVoices().filter(v=>/^en/i.test(v.lang)):[]}catch(e){return []}}
function pickVoice(){
  const vs=voices();if(!vs.length)return null;
  if(prefs.voice){const v=vs.find(x=>x.name===prefs.voice);if(v)return v;}
  const pref=[/karen/i,/catherine/i,/samantha/i,/google uk english female/i,/natural/i];
  for(const r of pref){const v=vs.find(x=>r.test(x.name));if(v)return v;}
  return vs.find(v=>/en-AU/i.test(v.lang))||vs.find(v=>/en-GB/i.test(v.lang))||vs[0];
}
function fillVoices(){
  const sel=$("#voiceSel");if(!sel)return;const vs=voices(),cur=pickVoice();
  sel.innerHTML=vs.length?vs.map(v=>`<option value="${esc(v.name)}"${cur&&v.name===cur.name?" selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join(""):`<option>No voices found on this device</option>`;
}
if(synth&&"onvoiceschanged" in synth)synth.onvoiceschanged=fillVoices;
function say(text,interrupt){
  if(!synth||prefs.muted)return;
  try{
    if(interrupt)synth.cancel();
    const v=pickVoice();
    text.split(/(?<=[.!?])\s+/).forEach(part=>{if(!part.trim())return;const u=new SpeechSynthesisUtterance(part);if(v){u.voice=v;u.lang=v.lang;}u.rate=+prefs.rate||0.95;u.pitch=1.15;synth.speak(u);});
  }catch(e){}
}

/* ---------- Sounds ---------- */
let actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}}
function chime(big){
  if(!actx)return;const notes=big?[523,659,784,1047]:[659,880];
  notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*0.13;o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+0.55);});
}

/* ---------- Player ---------- */
let P=null,wake=null;
const C=2*Math.PI*90;
function cueTimes(s){
  const cues=s.a.cues||[],k=cues.length,out=[];
  cues.forEach((c,i)=>out.push({t:14+(i+0.5)*(s.dur-28)/Math.max(k,1),text:c}));
  if(s.k==="move"||s.k==="game")out.push({t:s.dur-10,text:TEN[Math.floor(Math.random()*TEN.length)]});
  return out;
}
async function requestWake(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request("screen");}catch(e){}}
function releaseWake(){try{wake&&wake.release();}catch(e){}wake=null;}

function startSession(plan){
  unlockAudio();
  P={plan,seg:0,t:0,running:true,last:Date.now(),cues:cueTimes(plan.segs[0]),fired:new Set(),finished:false};
  $("#player").hidden=false;document.body.style.overflow="hidden";
  buildPlayer();
  const hello=`Good morning, ${plan.theme[0]}! It's ${DOW[plan.date.getDay()]}. Seven minutes of brain sparks, starting now! `;
  say(hello+SEG.breathe.intro+" "+plan.segs[0].a.n+". "+plan.segs[0].a.say,true);
  chime(false);
  P.timer=setInterval(tick,200);requestWake();
}
function buildPlayer(){
  const s=P.plan.segs[P.seg],S=SEG[s.k],el=$("#player");
  el.style.setProperty("--pc",S.color);el.style.setProperty("--pf",S.fg);
  const breathy=s.k==="breathe"||s.k==="calm";
  el.innerHTML=`<div class="pInner">
    <div class="pTop"><button id="pStop" aria-label="Stop and close">✕ Stop</button><span class="pTotal" id="pTotal"></span><button id="pMute" aria-label="Narrator on or off">${prefs.muted?"🔇":"🔊"}</button></div>
    <div class="segBar">${ORDER.map((k,i)=>`<div><i id="sb${i}"></i></div>`).join("")}</div>
    <div class="ringWrap">${breathy?`<div class="bubble" id="bubble"></div>`:""}
      <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="14"/><circle id="ring" cx="100" cy="100" r="90" fill="none" stroke="${S.fg==="#FFFFFF"?"#FFFFFF":"#2A2150"}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
      <div class="center"><span class="bigEm">${s.a.e}</span><span class="segTime" id="segTime">${fmt(s.dur)}</span></div></div>
    <div class="breathWord" id="breathWord" aria-live="polite"></div>
    <div class="pTitle"><div class="k">Step ${P.seg+1} of 4 · ${S.label}</div><h2>${esc(s.a.n)}</h2>${s.a.m!=="any"?`<div style="margin-top:6px">${modeTag(s.a,P.plan.mode)}</div>`:""}</div>
    <div class="pCard"><ol>${s.a.steps.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>
    <div class="pCard"><div class="ages" style="margin:0">${agesHTML(s.a)}</div></div>
    <div class="pCtrls"><button id="pPause">${P.running?"⏸ Pause":"▶ Play"}</button><button class="ghost" id="pSkip">Next ⏭</button></div>
  </div>`;
  $("#pStop").onclick=stopSession;
  $("#pSkip").onclick=()=>nextSeg();
  $("#pPause").onclick=togglePause;
  $("#pMute").onclick=()=>{prefs.muted=!prefs.muted;store.set("sms.prefs",prefs);if(prefs.muted&&synth)synth.cancel();$("#pMute").textContent=prefs.muted?"🔇":"🔊";};
  updatePlayer();
}
function togglePause(){
  P.running=!P.running;P.last=Date.now();
  try{if(synth){P.running?synth.resume():synth.pause();}}catch(e){}
  $("#pPause").textContent=P.running?"⏸ Pause":"▶ Play";
}
function tick(){
  if(!P||!P.running||P.finished)return;
  const now=Date.now();P.t+=(now-P.last)/1000;P.last=now;
  const s=P.plan.segs[P.seg];
  P.cues.forEach((c,i)=>{if(P.t>=c.t&&!P.fired.has(i)){P.fired.add(i);say(c.text);}});
  if(P.t>=s.dur){nextSeg();return;}
  updatePlayer();
}
function updatePlayer(){
  const s=P.plan.segs[P.seg];
  const rem=s.dur-P.t;$("#segTime").textContent=fmt(rem);
  $("#ring").setAttribute("stroke-dashoffset",String(C*(1-Math.max(0,rem)/s.dur)));
  let before=0;for(let i=0;i<P.seg;i++)before+=P.plan.segs[i].dur;
  $("#pTotal").textContent=fmt(420-before-P.t)+" left";
  ORDER.forEach((k,i)=>{const w=i<P.seg?100:i>P.seg?0:Math.min(100,P.t/s.dur*100);$("#sb"+i).style.width=w+"%";});
  const b=$("#bubble"),bw=$("#breathWord");
  if(b){const inhale=(P.t%8)<4;b.classList.toggle("in",inhale);bw.textContent=inhale?"Breathe in…":"Breathe out…";}else bw.textContent="";
}
function nextSeg(){
  if(!P)return;
  P.seg++;
  if(P.seg>=4){finish();return;}
  const s=P.plan.segs[P.seg];P.t=0;P.last=Date.now();P.fired=new Set();P.cues=cueTimes(s);
  chime(false);
  if(!P.running){P.running=true;try{synth&&synth.resume();}catch(e){}}
  say(SEG[s.k].intro+" "+s.a.n+". "+s.a.say,true);
  buildPlayer();
}
function finish(){
  P.finished=true;clearInterval(P.timer);chime(true);say(END,true);
  const el=$("#player");el.style.setProperty("--pc","#FFC530");el.style.setProperty("--pf","#2A2150");
  el.innerHTML=`<div class="pInner"><div class="finish">
    <div class="trophy">🏆</div><h2>7 minutes done!</h2>
    <p>Brains switched on and ready for a brilliant day. Who joined in? Tap to give a star.</p>
    ${doneButtons(P.plan.date)}
    <button class="startBtn" id="pDone" style="max-width:320px">Finished</button></div></div>`;
  el.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{toggleStar(P.plan.date,+b.dataset.star);b.setAttribute("aria-pressed",String(!!done[keyOf(P.plan.date)][+b.dataset.star]));});
  $("#pDone").onclick=stopSession;
  confetti();
}
function stopSession(){
  if(P){clearInterval(P.timer);}P=null;try{synth&&synth.cancel();}catch(e){}
  releaseWake();$("#player").hidden=true;document.body.style.overflow="";
  if(view==="today")renderToday();else if(view==="cal")renderCal();
}
document.addEventListener("visibilitychange",()=>{if(P&&!P.finished&&document.visibilityState==="visible"){requestWake();}});

/* ---------- Confetti ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("#confetti"),ctx=cv.getContext("2d");cv.hidden=false;cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#7A5CFF","#FF7A3D","#1FCB94","#FF4F93","#29B6F6","#FFFFFF"];
  const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  const t0=performance.now();
  (function fr(t){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore();});
    if(t-t0<3500)requestAnimationFrame(fr);else{ctx.clearRect(0,0,cv.width,cv.height);cv.hidden=true;}})(t0);
}

renderKidsBar();setView(location.hash==="#calendar"?"cal":location.hash==="#grownups"?"grown":"today");
</script>
